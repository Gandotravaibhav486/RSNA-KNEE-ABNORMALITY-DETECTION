<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #F4F1E9; }
    a { color: #1D3B2C; text-decoration: none; }
    a:hover { color: #12261B; }
  </style>
</helmet>
<div style="width: 1200px; height: 400px; box-sizing: border-box; background: #F4F1E9; color: #15150F; padding: 48px 60px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'IBM Plex Sans', system-ui, sans-serif; border-bottom: 8px solid {{accent}};">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="34" height="40" viewBox="0 0 434 512" fill="none" aria-hidden="true">
        <path d="M20 22 L184 136 V376 L20 490 Z" fill="{{accent}}" stroke="{{accent}}" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="M414 22 L250 136 V376 L414 490 Z" fill="none" stroke="{{accent}}" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"></path>
      </svg>
      <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 38px; line-height: 1; letter-spacing: -0.012em;">mockintervew</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6A58;">One interview · ~15 min</span>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 48px;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 62px; line-height: 1.05; letter-spacing: -0.022em; text-wrap: pretty; max-width: 660px;">75% of the grade is how you came across.</div>
    <div style="display: flex; flex-direction: column; gap: 12px; width: 320px;">
      <div style="display: flex; gap: 6px; height: 20px;">
        <div style="width: 25%; background: #15150F;"></div>
        <div style="width: 75%; background: {{accent}};"></div>
      </div>
      <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.07em; text-transform: uppercase; color: #6B6A58; line-height: 1.6;">25% correctness<br>75% clarity · delivery · presence</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1D3B2C","options":["#1D3B2C","#15150F","#8A6B22","#3F5E4C"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1D3B2C' };
  }
}
</script>
</body>
</html>
